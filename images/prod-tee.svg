<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="teeBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#282828"/>
      <stop offset="70%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#101010"/>
    </radialGradient>
    <radialGradient id="acidWash" cx="48%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3C3C40"/>
      <stop offset="55%" stop-color="#242427"/>
      <stop offset="100%" stop-color="#151517"/>
    </radialGradient>
    <filter id="teeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#teeBg)"/>

  <!-- Corner frame ticks -->
  <g stroke="rgba(255,77,0,0.35)" stroke-width="1.5" fill="none">
    <path d="M40 70 L40 40 L70 40"/>
    <path d="M730 40 L760 40 L760 70"/>
    <path d="M40 730 L40 760 L70 760"/>
    <path d="M730 760 L760 760 L760 730"/>
  </g>

  <!-- Oversized Boxy Heavyweight Tee -->
  <g filter="url(#teeShadow)">
    <!-- Back Collar Shadow -->
    <path d="M332 145 Q400 175 468 145 L455 130 Q400 148 345 130 Z" fill="#0F0F10"/>

    <!-- Main Tee Body + Drop Shoulders -->
    <path d="M330 142
             L210 172
             L105 320
             L205 388
             L245 335
             L245 668
             L555 668
             L555 335
             L595 388
             L695 320
             L590 172
             L470 142
             Q400 205 330 142 Z"
          fill="url(#acidWash)" stroke="#38383E" stroke-width="2"/>

    <!-- Thick Ribbed Crewneck Collar -->
    <path d="M322 144 Q400 218 478 144" fill="none" stroke="#2F2F34" stroke-width="18" stroke-linecap="round"/>
    <path d="M330 144 Q400 206 470 144" fill="none" stroke="#18181A" stroke-width="3"/>

    <!-- Dropped Shoulder & Sleeve Seams -->
    <path d="M215 174 L245 335" stroke="#45454B" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M585 174 L555 335" stroke="#45454B" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Minimalist Geometric Back/Chest Graphic Motif -->
    <g opacity="0.82">
      <rect x="315" y="295" width="170" height="170" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="315" y1="295" x2="485" y2="465" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
      <line x1="485" y1="295" x2="315" y2="465" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
      <circle cx="400" cy="380" r="46" fill="none" stroke="#CCFF00" stroke-width="2" stroke-dasharray="10 6"/>
      <rect x="378" y="372" width="44" height="16" fill="#FF4D00"/>
    </g>

    <!-- Twin-Needle Bottom Hem Stitch -->
    <line x1="246" y1="646" x2="554" y2="646" stroke="#424248" stroke-width="1.2" stroke-dasharray="5 3"/>
    <line x1="246" y1="652" x2="554" y2="652" stroke="#424248" stroke-width="1.2" stroke-dasharray="5 3"/>

    <!-- Signal Orange Woven Hem Tag -->
    <rect x="268" y="638" width="28" height="32" rx="1" fill="#FF4D00"/>
    <line x1="274" y1="648" x2="290" y2="648" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="274" y1="656" x2="286" y2="656" stroke="#0D0D0D" stroke-width="2"/>
  </g>

  <text x="55" y="750" fill="rgba(255,255,255,0.45)" font-family="monospace" font-size="14" letter-spacing="3">UD-TEE // 310 GSM ACID WASH</text>
</svg>
